# Ownmind 部署：cp .env.example .env，填好域名后 docker compose up -d
name: ownmind

x-ownmind: &ownmind
  image: ${OWNMIND_IMAGE:-ghcr.io/skadli/ownmind:edge}
  env_file: .env
  volumes:
    - ownmind-data:/data
    - sandbox-secret:/secret

services:
  # 先迁移：一次性任务，成功退出后 server 才启动
  migrate:
    <<: *ownmind
    command: ["migrate"]
    restart: "no"

  ownmind:
    <<: *ownmind
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 沙盒：agent 的命令和文件操作都在这里（决策 003）。不暴露端口，只在 Compose 网络内可达。
  sandbox:
    image: ${OWNMIND_SANDBOX_IMAGE:-ghcr.io/skadli/ownmind-sandbox:edge}
    restart: unless-stopped
    cpus: ${OWNMIND_SANDBOX_CPUS:-1.0}
    mem_limit: ${OWNMIND_SANDBOX_MEMORY:-1g}
    pids_limit: 512
    volumes:
      - sandbox-workspace:/workspace
      - sandbox-secret:/secret:ro
    depends_on:
      ownmind:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      OWNMIND_DOMAIN: ${OWNMIND_DOMAIN:?在 .env 里设置 OWNMIND_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ownmind:
        condition: service_healthy

volumes:
  ownmind-data:
  sandbox-workspace:
  sandbox-secret:
  caddy-data:
  caddy-config:
